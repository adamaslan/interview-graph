name: PR build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build report
        run: |
          {
            echo "## Build report"
            echo
            echo "Commit \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`"
            echo
            node scripts/build-report.mjs dist
          } >> "$GITHUB_STEP_SUMMARY"
